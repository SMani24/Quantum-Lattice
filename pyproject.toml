[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-lattice-research"
version = "0.1.0"
description = "Toric-code Hamiltonian calibration and spatial inference experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]
